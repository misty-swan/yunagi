[package]
name = "yunagi-cli"
description = "コンソール用バイナリ yunagi（CLI と MCP サーバー）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "yunagi_cli"
path = "src/lib.rs"

[[bin]]
name = "yunagi"
path = "src/main.rs"

[dependencies]
yunagi-core.workspace = true
yunagi-api.workspace = true
serde_json.workspace = true
# `agent setup`：Codex の設定ファイルの書き換えと、バックアップの名前の日時
toml_edit.workspace = true
jiff.workspace = true

[dev-dependencies]
tempfile.workspace = true

# 結合テスト（テスト計画書 4.5「CLI」）。既定ディレクトリを一時フォルダにするため、環境変数を設定してから
# 1つのスレッドで順に走らせる（テストの仕組み（harness）を使わず、main から走らせる）
[[test]]
name = "cli"
harness = false
