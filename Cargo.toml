[workspace]
resolver = "3"
members = ["crates/core", "crates/api", "crates/cli", "src-tauri"]
# 技術選定の試作（experiments/）は、それぞれ独立したプロジェクトとしてビルドする
exclude = ["experiments"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
# 本体のライセンス（利用する人がどちらかを選べる。LICENSE-MIT・LICENSE-APACHE。docs/legal/third-party-licenses.md 3章）。
# 4つのクレートは `license.workspace = true` で使う。crates.io には出さない（publish = false）
license = "MIT OR Apache-2.0"

# 説明（doc コメント）の警告。rustdoc が既定で警告にするもの（`rustdoc -W help` で warn のもの）を、
# すべて失敗にする（`pnpm check:doc`）。Rust の版を上げたら、増えたものが無いかを確かめて足す。
# `--config` の `-D warnings` と違い、環境変数 RUSTDOCFLAGS などを設定していても効く
# （cargo はこの設定を RUSTDOCFLAGS と一緒に渡す）。各クレートは `[lints] workspace = true` で使う
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
broken_footnote = "deny"
unused_footnote_definition = "deny"
redundant_explicit_links = "deny"

[workspace.dependencies]
yunagi-core = { path = "crates/core" }
yunagi-api = { path = "crates/api" }
yunagi-cli = { path = "crates/cli" }
# IME の英数入力への切替（Vim モード。docs/design/01-architecture.md 3.4、src-tauri/src/ime.rs）。
# どちらも Tauri がすでに使っている版にそろえ、新しく取り込むコードを増やさない（Cargo.lock の版）。
# Windows：IMM の呼び出し。macOS：入力ソース API が返す文字列・配列の扱い
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging"] }
core-foundation = "0.10"
# 利用者のホームを OS に尋ねる（パスワードデータベース。別の候補の既定ディレクトリを求める。
# crates/core/src/storage/dir_mismatch.rs）。Cargo.lock にすでにある版にそろえる
libc = "=0.2.191"
# UNIX ドメインソケットへの接続の時間切れ（crates/api/src/transport/unix.rs）。Cargo.lock にある版
socket2 = "=0.6.5"
# Tauri は正確な版で固定する。画面側の @tauri-apps/api・@tauri-apps/cli（package.json）と
# 版の 2.12 系をそろえる（Tauri は major.minor が食い違うと警告する）
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "=2.7.4", features = [] }
# フォルダを選ぶ OS のダイアログ（設定画面と起動時の画面。docs/design/03-ui-spec.md 7章・10.1）。
# 画面側の @tauri-apps/plugin-dialog（package.json）と版をそろえる
tauri-plugin-dialog = "=2.8.4"
# OS 全体のショートカット（Yunagi を前面に呼び出す。docs/design/04-interaction-spec.md 1章・2章、
# src-tauri/src/global_shortcut.rs）。登録は Rust 側だけで行い、画面側のパッケージは入れない。
# 3.x は alpha なので 2.x の最新に固定する
tauri-plugin-global-shortcut = "=2.4.1"
# 2 つ目のアプリの起動を、動いているアプリに引き渡して終わる（`yunagi show` が、データベースを開く前の
# 画面の間にもう 1 つアプリを起動してしまわないようにする。docs/design/01-architecture.md 3.5、
# src-tauri/src/lib.rs）。Linux は D-Bus、macOS は UNIX ドメインソケット、Windows は名前付きの
# ミューテックスで見つける。3.x は alpha なので 2.x の最新（2026-10-28 公開。2.5.5 は引き渡しが
# 受け入れられてから終了する修正を含む）に固定する
tauri-plugin-single-instance = "=2.5.5"
# 依頼文の書き出し（Mod+Shift+A。docs/design/04-interaction-spec.md 2章、05-mcp-cli-spec.md 5章）を
# クリップボードに写す。Rust 側（src-tauri/src/commands.rs の `copy_handoff`）だけで使い、画面側の
# パッケージは入れず、画面（WebView）には書き込みの権限を与えない（capabilities/default.json）。
# 画面から `navigator.clipboard` で書くと、依頼文を作る間にキー操作の後という扱いが切れ、WebKit 系で
# 断られうるため。3.x は alpha なので 2.x の最新（2026-10-14 公開）に固定する
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-updater = "=2.14.0"
# SQLite（docs/design/01-architecture.md 3章）。bundled で SQLite 本体（FTS5 を含む）を
# 同梱してビルドし、OS ごとの SQLite の版の違いに左右されないようにする。
# backup はマイグレーション前のバックアップと失敗時の復元に使う（SQLite のオンラインバックアップ）
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
# テストで使う一時フォルダ（テストが終わると消える）
tempfile = "=3.27.0"
# 時刻とタイムゾーン（論理日付の計算。crates/core/src/domain/logical_date.rs）
jiff = "=0.2.38"
# ULID（主キー）の乱数部分を OS から得る（crates/core/src/storage/ulid.rs）。
# tempfile などが同じ版をすでに使っているので、新たに取り込むコードは増えない
getrandom = "=0.4.3"
# config.json の読み書き（crates/core/src/storage/data_dir.rs）。Tauri がすでに使っている版に
# そろえ、新しく取り込むコードを増やさない
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Codex の設定ファイル（config.toml）の書き換え（crates/cli/src/agent_setup/codex.rs）。コメントと並びを
# 保ったまま、`[mcp_servers.yunagi]` だけを足す・直すために使う。Tauri がすでに使っている版にそろえ、
# 新しく取り込むコードを増やさない（2026-11-04 に確かめた最新の安定版は 0.25.18 だが、公開した当日なので
# 使わない。0.25.17 は 2026-10-09 公開。どちらも Rust 1.85 以上）。必要な機能は構文の読み取りと書き出しだけ
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display"] }
# 画面（TypeScript）と共有する型の定義を Rust の型から作る（src-tauri/src/bindings.rs）。
# 安定版があり、Tauri に縛られない。serde の名前の付け方（rename_all など）を読んでそろえる
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat"] }
