# GitHub Actions の action の更新を、Dependabot が PR で知らせる。
# 固定と更新の決まりは docs/release/07-build-and-distribution.md 3章「action の固定」。
# Rust・JavaScript の依存の更新は、ここでは扱わない（docs/release/SECURITY.md 4.4）。
version: 2
updates:
  - package-ecosystem: github-actions
    # ワークフロー（.github/workflows/）は、directory を `/` にすると調べてくれる
    directory: /
    schedule:
      interval: weekly
    # 公開から 14 日たった版だけを PR にする（SECURITY.md 4.4 の「公開から一定期間を経た版」と同じ）。
    # 脆弱性の修正の PR は、この待ち時間に関係なく出る。
    cooldown:
      default-days: 14
