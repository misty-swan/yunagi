# 公式サイト（site/）を Cloudflare Pages へ Direct Upload で公開する。
# 決まり：docs/release/07-build-and-distribution.md 2章「公式サイトの置き場所」「公式サイトの作り方」・3.4。
#
# - 動くのは、main への push（サイトに関わるファイルが変わったとき。ただしリポジトリの変数 SITE_DEPLOY が true のときだけ）と、
#   手動の実行（workflow_dispatch）だけ。pull_request・pull_request_target では動かさない（フォークの PR に secrets を渡さない）。
# - build ジョブは secrets を使わない。サイトをビルドし、いま公開中の latest.json を取り込む（取れなければ中止する）。
# - deploy ジョブだけが secrets を持つ。Environment `cloudflare-pages`（main だけに制限する。オーナーの作業は 07 の手順書）に置き、
#   リポジトリのコードは動かさない（ビルド済みの成果物を上げるだけ）。トークンが無ければ、何も上げずに失敗する。
# - `uses:` の action は、コミットの SHA で固定し、行末に版を書く（07 の 3章「action の固定」）。
#   cloudflare/wrangler-action は GitHub 製ではない。使うには、リポジトリの許可する action の一覧に
#   `cloudflare/wrangler-action@*` を足す必要がある（Settings → Actions → General。07 の手順書 ⑤）。
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install/install.sh"
      - "install/install.ps1"
      - "scripts/release/package.ts"
      - "scripts/release/version.ts"
      - "docs/user/**"
      - "docs/operations/CHANGELOG.md"
      - "docs/operations/CHANGELOG.en.md"
      - "src/assets/fonts/inter/**"
      - "src-tauri/icons/source/app-icon.svg"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
      - ".github/workflows/site.yml"
  workflow_dispatch:
    inputs:
      allow_missing_latest:
        description: "公開中の latest.json が無い・取れなくても、含めずに進める（最初の公開の手動実行だけで true にする）"
        type: boolean
        default: false

# 公開は 1 つずつ。古い実行を途中で止めない（公開の途中で止めると、中途半端な状態になりうるため）。
# build が取った latest.json が古くなって、先に公開されたリリースのものを上書きしないよう、
# リリースのデプロイ（YUN-101）も同じ group 名 `site-deploy` を使う（07 の 2章「公式サイトの公開の仕組み」）。
# 待っていた実行は、前の公開が終わってから始まり、そのときに latest.json を取る
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    # 自動の公開は、オーナーが SITE_DEPLOY=true にしてから（07 の手順書 ⑥）。手動の実行はいつでも
    if: github.repository == 'misty-swan/yunagi' && (github.event_name == 'workflow_dispatch' || vars.SITE_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 版は package.json の packageManager から読む
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # サイトの検査（リンク切れ・日英がそろうこと・色・外部の読み込みが無いこと）
      - name: Check site
        run: pnpm exec vitest run site

      # サイトだけの変更でも、いま公開中の latest.json を含める。取れなければ中止する
      # （含め忘れて 404 にしない。古い写しで上書きしない。07 の 3.4）
      - name: Fetch the published latest.json
        env:
          ALLOW_MISSING: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_missing_latest && '--allow-missing' || '' }}
        run: node site/fetch-latest.ts --out "$RUNNER_TEMP/latest.json" $ALLOW_MISSING

      - name: Build site
        run: |
          if [ -f "$RUNNER_TEMP/latest.json" ]; then
            pnpm site:build --latest-json "$RUNNER_TEMP/latest.json"
          else
            pnpm site:build
          fi
          test -f site/dist/ja/index.html
          test -f site/dist/en/index.html
          test -f site/dist/_headers

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # main のものだけを公開する（別のブランチからの手動の実行は、build までで終わる）
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # secrets（CLOUDFLARE_API_TOKEN・CLOUDFLARE_ACCOUNT_ID）は、この Environment にだけ置く
    environment: cloudflare-pages
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist

      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Environment cloudflare-pages に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が無いので、何も上げずに止める（docs/release/07-build-and-distribution.md の手順書 ③④）"
            exit 1
          fi

      # wrangler の版は固定する（公開から 14 日たった版。SECURITY.md 4.4）。--branch は Pages のプロジェクトの本番ブランチ名
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: pages deploy site/dist --project-name=yunagi --branch=main --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }} --commit-dirty=true
