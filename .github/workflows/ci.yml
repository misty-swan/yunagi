# 開発用 CI：PR と main への push のたびに、手元と同じ `pnpm check` を走らせる。
# 配布用のビルド（docs/release/07-build-and-distribution.md 3章）とは別のもの。
# 検査の中身は package.json の `check` にだけ書き、ここには書かない（手元と CI をずらさないため）。
# 例外は macOS・Windows の `rust-test`：Node.js・pnpm を入れずに時間を省くため、`check:rust`・`check:clippy`
# と同じコマンドを直接書く（変えるときは package.json の同じ行と合わせる。テストには OS ごとの失敗を
# 一度に全部出す `--no-fail-fast` を足している）。
# `uses:` の action は、コミットの SHA で固定し、行末に版を書く（決まりと更新の仕方は
# docs/release/07-build-and-distribution.md 3章「action の固定」。更新は .github/dependabot.yml の Dependabot）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR で新しい push があったら、古い実行は止める。
# main への push はコミットごとに別のグループにして、どの push も取り消さずに検査する。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: pnpm check (Linux)
    # macOS・Windows では、OS で動きが変わる Rust のテストだけを走らせる（下の `rust-test`）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri（yunagi-app）のコンパイルに要る Linux のライブラリ
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # 版と clippy・rustfmt は rust-toolchain.toml から読む
      - name: Install Rust
        run: rustup toolchain install

      # target/ と cargo の取得物をキャッシュする（Cargo.lock や Rust の版が変わると作り直す）。
      # 保存は main だけで行い（PR は main のキャッシュを使う）、容量の上限を PR ごとの分で埋めない。
      # 検査が失敗しても、時間のかかるビルド結果は保存する。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # 版は package.json の packageManager から読む
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 版は .node-version から読む（手元の nvm・fnm・mise なども同じファイルを読む）
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: pnpm check

  # この PR が Rust に関係するファイルを変えたか（macOS・Windows のジョブを走らせるか）を決める。
  # main への push は常に走らせる。関係するファイル：コア・CLI・API・アプリ本体（crates/・src-tauri/）、
  # 依存と道具の版（Cargo.toml・Cargo.lock・rust-toolchain.toml・clippy.toml・.cargo/）、この定義。
  changes:
    name: 変更の確認
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(crates/|src-tauri/|\.cargo/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|clippy\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # macOS・Windows では、Rust のテスト（`cargo test --workspace`）と clippy だけを走らせる。
  # OS ごとに分かれたコード（`yunagi.lock` のロック、Windows だけの再試行など）は Linux ではコンパイルもされないため、
  # 各 OS でのコンパイルとテストが要る。画面の型チェック・テスト、書式、文書の生成は OS で変わらないので Linux だけで足りる
  # （範囲と時間の見込みの理由は docs/release/08-test-plan.md 2章）。
  #
  # macOS は 1 分が Linux の約 10 倍、Windows は約 1.7 倍の料金になる（非公開リポジトリ。08 の 2章）ので、
  # PR では Rust に関係するファイルを変えたときだけ走らせる。main への push では常に走らせる。
  rust-test:
    name: cargo test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版と clippy・rustfmt は rust-toolchain.toml から読む
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      - name: cargo clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
