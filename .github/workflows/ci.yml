# 開発用 CI：PR と main への push のたびに、手元と同じ `pnpm check` を走らせる。
# 配布用のビルド（docs/release/07-build-and-distribution.md 3章）とは別のもの。
# 検査の中身は package.json の `check` にだけ書き、ここには書かない（手元と CI をずらさないため）。
# `uses:` の action は、コミットの SHA で固定し、行末に版を書く（決まりと更新の仕方は
# docs/release/07-build-and-distribution.md 3章「action の固定」。更新は .github/dependabot.yml の Dependabot）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR で新しい push があったら、古い実行は止める。
# main への push はコミットごとに別のグループにして、どの push も取り消さずに検査する。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: pnpm check (Linux)
    # macOS・Windows では、OS で動きが変わる Rust のテストだけを走らせる（下の `rust-test`）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri（yunagi-app）のコンパイルに要る Linux のライブラリ
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # 版と clippy・rustfmt は rust-toolchain.toml から読む
      - name: Install Rust
        run: rustup toolchain install

      # target/ と cargo の取得物をキャッシュする（Cargo.lock や Rust の版が変わると作り直す）。
      # 保存は main だけで行い（PR は main のキャッシュを使う）、容量の上限を PR ごとの分で埋めない。
      # 検査が失敗しても、時間のかかるビルド結果は保存する。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # 版は package.json の packageManager から読む
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 版は .node-version から読む（手元の nvm・fnm・mise なども同じファイルを読む）
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: pnpm check

  # macOS・Windows では、Rust のテスト（`cargo test --workspace`）と clippy だけを走らせる。
  # OS ごとに分かれたコード（`yunagi.lock` のロック、Windows だけの再試行など）は Linux ではコンパイルもされないため、
  # 各 OS でのコンパイルとテストが要る。画面の型チェック・テスト、書式、文書の生成は OS で変わらないので Linux だけで足りる
  # （範囲と時間の見込みの理由は docs/release/08-test-plan.md 2章）。
  rust-test:
    name: cargo test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版と clippy・rustfmt は rust-toolchain.toml から読む
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      - name: cargo clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: TEMP each CLI test (macOS)
        if: (success() || failure()) && matrix.name == 'macOS'
        run: |
          names=$(sed -n '/let tests: \[(&str, Test)/,/^    \];/p' crates/cli/tests/cli/unix.rs | grep -oE '"[a-z_]+"' | tr -d '"')
          for n in $names; do
            cargo test -p yunagi-cli --test cli --locked -- "$n" > /tmp/out.txt 2>&1 || { echo "FAIL $n"; grep -E 'panicked|assertion|left:|right:' -A2 /tmp/out.txt | head -8; }
          done

      - name: TEMP timing (Windows slow tests)
        if: always() && matrix.name == 'Windows'
        run: RUSTC_BOOTSTRAP=1 cargo test -p yunagi-core --lib --locked -- -Z unstable-options --report-time --test-threads=1 corrupted use_existing_data_dir_refuses
