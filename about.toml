# cargo-about の設定：Rust の依存のライセンスの収集と、許可外ライセンスの検出
# （docs/legal/third-party-licenses.md 2章、docs/release/07-build-and-distribution.md 3章）。
# 使い方は `node scripts/release/licenses.ts`（scripts/release/licenses.ts の先頭）。

# 配布する OS・アーキテクチャ（07 2章）の依存だけを数える。ほかの OS 専用の依存は、配布物に入らない
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# ビルド時とテスト時にだけ使う依存（ビルドスクリプト・proc-macro・dev-dependencies）は、実行ファイルに
# 入らないので、配布の条件の対象にしない
ignore-build-dependencies = true
ignore-dev-dependencies = true

# 自分たちのクレート（publish = false。ライセンスを書いていない）は数えない
private = { ignore = true }

# 許可するライセンス。scripts/release/license-policy.json の `allowed` と `pending` を合わせたものと同じに保つ
# （scripts/release/licenses.test.ts が確かめる）。`pending` は、新しい依存が一覧に無い
# ライセンスを連れてきたとき、許可するか決まるまでの暫定の置き場で、ふだんは空（入っている間は、配布用 CI の
# 許可外ライセンスの検査は落とす）。cargo-about は、ここに無いライセンスしか使えない依存があると、一覧を作れずに
# 失敗するので、決まるまでの間も一覧は作れるように、暫定のものもここに置く
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
]
