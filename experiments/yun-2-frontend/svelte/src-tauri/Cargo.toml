[package]
name = "yun2-svelte"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# 両版で同じ設定にする（比較のため）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
