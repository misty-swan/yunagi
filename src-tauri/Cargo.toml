[package]
name = "yunagi-app"
description = "Yunagi のデスクトップアプリ（Tauri 2）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
yunagi-core.workspace = true
yunagi-api.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
jiff.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

# IME の英数入力への切替（src/ime.rs）。Linux は外部コマンドを呼ぶので、依存を足さない
[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[dev-dependencies]
# ローカル API の結合テスト（tests/api.rs）で、`yunagi`（CLI）をアプリ経由で動かす
yunagi-cli.workspace = true
# 結合テスト（tests/）で、WebView を開かずにコマンドとイベントを呼ぶ（tauri::test）
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
# 登録の失敗の文の見分けを、部品が実際に返す文で確かめる（src/global_shortcut.rs のテスト）。
# プラグインが使っている版（Cargo.lock）にそろえる。プラグインの版を上げるときは、この版も同じに上げる
# （ずれると、別の版の文を確かめることになる）
global-hotkey = "=0.8.0"
# 画面と共有する型の TypeScript の定義を作る（src/bindings.rs のテスト。配るアプリには含めない）
ts-rs.workspace = true

# 画面とコアの結合テスト。既定ディレクトリを一時フォルダにするため、環境変数を設定してから
# 1つのスレッドで順に走らせる（テストの仕組み（harness）を使わず、main から走らせる）
[[test]]
name = "bridge"
harness = false

# ローカル API の結合テスト（テスト計画書 4.2）。実際にソケットで待ち受け、既定ディレクトリを
# 一時フォルダにするため、bridge と同じく main から走らせる
[[test]]
name = "api"
harness = false

# 強制終了の試験（テスト計画書 4.1）。コアを子プロセスで動かして SIGKILL で止める。既定ディレクトリを
# 一時フォルダにするため、bridge と同じく main から走らせる
[[test]]
name = "crash"
harness = false
