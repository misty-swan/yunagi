[package]
name = "yunagi-app"
description = "Yunagi のデスクトップアプリ（Tauri 2）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
yunagi-core.workspace = true
tauri.workspace = true
jiff.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true

[dev-dependencies]
# 結合テスト（tests/）で、WebView を開かずにコマンドとイベントを呼ぶ（tauri::test）
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true

# 画面とコアの結合テスト。既定ディレクトリを一時フォルダにするため、環境変数を設定してから
# 1つのスレッドで順に走らせる（テストの仕組み（harness）を使わず、main から走らせる）
[[test]]
name = "bridge"
harness = false
